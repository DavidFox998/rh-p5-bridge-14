name: Verify Ensemble Chain (daily)

# Runs every day at 08:00 UTC and on demand.
#
# Condensed from 19 separate route repos (arakelov-rh-descent etc private)
# into rh-p5-bridge-14, a single referee-friendly repo. The check verifies
# the local Towers/ modules and records public core da3b943c662f against the
# CHAIN.md lock 6ec00281c55d. It does not call the GitHub API for private
# members. A private name in CHAIN.md is a warning skip, not an HTTP 404
# failure (run 37206175413).
#
# On a real local miss (missing Towers file, or the lock note removed):
#   - The job exits non-zero.
#   - A Slack message is posted via SLACK_WEBHOOK_URL when that secret exists.
#
# Required repository secret:
#   SLACK_WEBHOOK_URL  — incoming-webhook URL. If absent, the Slack step is skipped.

on:
  schedule:
    - cron: "0 8 * * *"    # every day at 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "Verify local Towers against CHAIN.md lock"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rh-p5-bridge-14
        uses: actions/checkout@v4

      - name: Verify local ensemble (skip private remotes)
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-ensemble.sh

      - name: Post Slack alert on failure
        if: failure() && steps.verify.conclusion == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EXPECTED: ${{ steps.verify.outputs.expected_sha }}
          ACTUAL:   ${{ steps.verify.outputs.actual_sha }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack alert (job still fails)."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c "
          import json, os
          expected = os.environ.get('EXPECTED', '(unknown)')
          actual   = os.environ.get('ACTUAL',   '(unknown)')
          run_url  = '${RUN_URL}'
          payload  = {
            'text': (
              '\u26a0\ufe0f *Opera Numerorum — local ensemble check failed*\n'
              'scripts/verify-ensemble.sh did not find the local Towers modules '
              'or the CHAIN.md lock note. Private remotes are skipped; this alert '
              'is not an HTTP 404 on arakelov-rh-descent.\n\n'
              f'  \u2022 *CHAIN.md lock:* \`{expected[:16]}\u2026\`\n'
              f'  \u2022 *Public core:*   \`{actual[:16]}\u2026\`\n\n'
              f'<{run_url}|View failed run>'
            )
          }
          print(json.dumps(payload))
          ")"
          echo "Slack alert sent."
