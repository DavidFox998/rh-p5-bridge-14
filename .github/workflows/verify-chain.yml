name: Verify Ensemble Chain (daily)

# Runs every day at 08:00 UTC and on demand.
# Recomputes the SHA256 chain digest from live HEAD commits and compares it
# against the value committed in CHAIN.md.
#
# rh-p5-bridge-14 is the bridge/meta repo that *contains* CHAIN.md.  Every
# re-lock PR merges a new commit *into* rh-p5-bridge-14, so fetching its live
# HEAD would always disagree with the just-merged CHAIN.md entry.  Instead we
# read rh-p5-bridge-14's SHA directly from the CHAIN.md table — this is the
# value that was current when the re-lock ran, which is the correct anchor.
#
# On drift:
#   - The job exits non-zero  →  GitHub Actions marks the check as failed.
#   - A Slack message is posted via the SLACK_WEBHOOK_URL repository secret.
#
# This workflow is read-only.  When drift is detected, the weekly re-lock
# workflow (relock-chain.yml) or a manual `workflow_dispatch` of it will
# create the PR that updates CHAIN.md / REPOS.md.
#
# Required repository secret:
#   SLACK_WEBHOOK_URL  — incoming-webhook URL for your Slack workspace.
#                        If absent, the Slack step is skipped gracefully.

on:
  schedule:
    - cron: "0 8 * * *"    # every day at 08:00 UTC
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read            # read-only; no writes needed

jobs:
  verify:
    name: "Verify chain SHA against live HEADs"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rh-p5-bridge-14
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify local ensemble (skip private remotes)
        id: verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/verify-ensemble.sh

      - name: Post Slack alert on drift
        if: failure() && steps.verify.conclusion == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          EXPECTED: ${{ steps.verify.outputs.expected_sha }}
          ACTUAL:   ${{ steps.verify.outputs.actual_sha }}
        run: |
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL secret not set — skipping Slack alert (job still fails)."
            exit 0
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          curl -sf -X POST "${SLACK_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            --data "$(python3 -c "
          import json, os
          expected = os.environ.get('EXPECTED', '(unknown)')
          actual   = os.environ.get('ACTUAL',   '(unknown)')
          run_url  = '${RUN_URL}'
          payload  = {
            'text': (
              '\u26a0\ufe0f *Opera Numerorum — ensemble chain drift detected*\n'
              'The chain SHA in \`rh-p5-bridge-14/CHAIN.md\` no longer matches '
              'the live HEAD commits.  Private route repos are skipped. A failure here is not an HTTP 404. '
              'received a new commit since the last re-lock.\n\n'
              f'  \u2022 *Stored SHA:* \`{expected[:16]}\u2026\`\n'
              f'  \u2022 *Live SHA:*   \`{actual[:16]}\u2026\`\n\n'
              f'<{run_url}|View failed run> \u2022 '
              'Trigger the *Chain Re-lock* workflow or run '
              '\`bash scripts/relock-chain.sh\` locally to create an update PR.'
            )
          }
          print(json.dumps(payload))
          ")"
          echo "Slack alert sent."
